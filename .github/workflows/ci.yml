name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Compile Python
        run: python -m compileall -q child_pugh.py cli.py tests
      - name: Run tests
        run: python -m pytest
      - name: Test browser calculation module
        run: node --test tests/web.test.mjs
      - name: Run CLI smoke tests
        run: |
          python cli.py single --bilirubin 2.5 --albumin 3.0 --inr 1.9 --ascites mild/controlled --encephalopathy "grade I-II" --creatinine 1.5
          python cli.py batch -i sample.csv -o out_smoke.csv
